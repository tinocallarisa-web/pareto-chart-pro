name: Feature request
description: Suggest something the visual should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests with a concrete analytical problem behind them get built first.
        Check the [roadmap](https://tinocallarisa-web.github.io/pareto-chart-pro/changelog.html#roadmap) — it may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out, and what stops you?
      description: The analytical question first, please — not the solution. It often has a better answer than the one imagined.
      placeholder: "I need to show which suppliers sit between the 50% and 80% thresholds, but I can only mark the lines, not the band between them."
    validations: { required: true }

  - type: dropdown
    id: area
    attributes:
      label: Which part of the visual?
      options:
        - "Binning and ranking"
        - "Cumulative line"
        - "Reference lines and thresholds"
        - "Colors and conditional formatting"
        - "Labels, axes and layout"
        - "Tooltips"
        - "Interaction (selection, drilldown, bookmarks)"
        - "Accessibility"
        - "Performance and large models"
        - "Other"
    validations: { required: true }

  - type: textarea
    id: workaround
    attributes:
      label: How are you working around it today?
      placeholder: "A DAX measure plus a separate line-and-clustered-column chart next to it."

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Mockups, screenshots from other tools, links.
